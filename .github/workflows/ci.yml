name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm run test:coverage

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx tsc -b
      - run: npm run test:coverage
        env:
          # Node 22+'s own native localStorage/sessionStorage otherwise
          # shadows jsdom's implementation in tests — see vite.config.ts's
          # matching comment. This flag doesn't exist before Node 22, so it
          # must not be applied to a job pinned below that (it errors
          # instead of being a no-op — confirmed against real Node 20/22/24
          # binaries, not assumed).
          NODE_OPTIONS: --no-experimental-webstorage

  # Builds both production images on every push/PR to catch Dockerfile
  # bit-rot early (a dependency bump breaking `prisma generate`, a
  # base-image change, etc.) — does not push anywhere, no registry
  # credentials involved. See docs/07-Deployment.md for the actual
  # deploy process.
  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: backend
          push: false
      - uses: docker/build-push-action@v6
        with:
          context: frontend
          push: false
