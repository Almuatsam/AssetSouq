server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Defense-in-depth for the static frontend response itself — the API's
    # own responses already get equivalent headers from helmet()
    # (backend/src/app.ts); nginx doesn't set these by default.
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Reverse-proxies to the backend container (Docker Compose service
    # name, resolved via Docker's embedded DNS) — mirrors dev's identical
    # Vite proxy (vite.config.ts), so the frontend can keep calling the
    # same relative "/api" base URL (apiClient.ts's default) in both
    # environments and the browser only ever talks to one origin. That
    # also means production doesn't need any CORS configuration at all —
    # see docs/07-Deployment.md.
    location /api/ {
        proxy_pass http://backend:4000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Vite fingerprints every built asset filename with a content hash
    # (see dist/assets/*), so these are safe to cache aggressively and
    # indefinitely — a new deploy produces new filenames, never a stale
    # cache hit on changed content.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Client-side routing (React Router) — any path that isn't a real
    # static file falls back to index.html so the app's own router can
    # handle it, instead of nginx 404ing a deep link like /admin/devices.
    # index.html itself is deliberately NOT cached (no `expires` here) —
    # it's the one file that must always be fetched fresh, since it's
    # what references the current build's hashed asset filenames.
    location / {
        try_files $uri /index.html;
    }
}
